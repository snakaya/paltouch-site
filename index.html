<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paltouch</title>
<meta name="description" content="A small collection of practical guides for home and digital life.">
<style>
  :root { --bg:#f7efe3; --paper:#fffdf8; --ink:#2c2622; --muted:#6f655d; --accent:#b8573c; --line:#e4d8c8; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#1c1916; --paper:#24201c; --ink:#f1e9df; --muted:#b3a79a; --accent:#e08a6c; --line:#3b342d; } }
  :root[data-theme="dark"] { --bg:#1c1916; --paper:#24201c; --ink:#f1e9df; --muted:#b3a79a; --accent:#e08a6c; --line:#3b342d; }
  body { margin:0; background:var(--bg); color:var(--ink); font:18px/1.65 Georgia, "Times New Roman", serif; }
  main { max-width:720px; margin:0 auto; padding:56px 16px; }
  h1 { font-size:40px; margin:0 0 6px; }
  p { color:var(--muted); }
  a.card { display:flex; gap:16px; align-items:center; background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:18px; margin-top:28px; color:var(--ink); text-decoration:none; }
  a.card img { border-radius:50%; flex:none; }
  a.card strong { font-size:21px; display:block; }
  a.card span { color:var(--muted); font-size:16px; }
  footer { color:var(--muted); font:14px/1.6 -apple-system, "Segoe UI", Arial, sans-serif; margin-top:48px; }
</style>
</head>
<body>
<main>
  <h1>Paltouch</h1>
  <p>A small collection of practical guides for making home and digital life a little easier.</p>
  <a class="card" href="tidypixels/index.html">
    <img src="tidypixels/assets/logo.png" alt="" width="64" height="64">
    <div><strong>Tidy Pixels</strong><span>Photo organizing and digital declutter</span></div>
  </a>
  <footer>&copy; 2026 Paltouch</footer>
</main>
</body>
</html>
